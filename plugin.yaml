id: lumide_jaspr
name: Jaspr
description: >
  Jaspr web framework support for the Lumide IDE.
entry_point: 'bin/main.dart'
publisher: pryspace

activation_events:
  - 'workspaceContains:pubspec.yaml'

permissions:
  - fileSystem:
      - '${workspace}/**'
  - shell:
      - jaspr
      - dart
      - which
      - where

configuration:
  - key: jaspr.logEntryLimit
    type: number
    default: 5000
    title: 'Log Entry Limit'
    description: 'Maximum number of log entries to keep in the Jaspr output channel.'
  - key: jaspr.autoImportOnSave
    type: boolean
    default: true
    title: 'Auto Import on Save'
    description: >
      When saving a .dart file in a Jaspr project, automatically add missing
      imports for jaspr, jaspr/dom, jaspr/client, jaspr/server, jaspr_router, and related packages.
  - key: jaspr.removeUnusedImportsOnSave
    type: boolean
    default: true
    title: 'Remove Unused Imports on Save'
    description: >
      When auto-import on save is enabled, also remove unused managed Jaspr
      imports (jaspr, dom, client, server, router, etc.) based on symbol heuristics.

contributes:
  commands:
    - id: jaspr.doctor
      title: 'Jaspr: Doctor'
      category: 'Jaspr'
    - id: jaspr.clean
      title: 'Jaspr: Clean'
      category: 'Jaspr'
    - id: jaspr.create
      title: 'Jaspr: New Project'
      category: 'Jaspr'
    - id: jaspr.serve
      title: 'Jaspr: Serve'
      category: 'Jaspr'
    - id: jaspr.stop
      title: 'Jaspr: Stop'
      category: 'Jaspr'
    - id: jaspr.debug
      title: 'Jaspr: Debug'
      category: 'Jaspr'
    - id: jaspr.tools
      title: 'Jaspr: Tools Menu'
      category: 'Jaspr'
    - id: jaspr.ensureImports
      title: 'Jaspr: Ensure Imports'
      category: 'Jaspr'
    - id: jaspr.context.clean
      title: 'Jaspr: Clean Here'
      category: 'Jaspr'
    - id: jaspr.context.doctor
      title: 'Jaspr: Doctor Here'
      category: 'Jaspr'
    - id: jaspr.context.create
      title: 'Jaspr: New Project Here'
      category: 'Jaspr'
  snippets:
    - language: dart
      path: snippets/dart.json

